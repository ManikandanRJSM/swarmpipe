name=swarmpipe-source
connector.class=io.debezium.connector.mysql.MySqlConnector
tasks.max=1

database.hostname=localhost
database.port=3306
database.user=swarmpipe
database.password=
database.server.id: "1",
database.dbname=swarmpipe_db

topic.prefix=swarmpipe

table.include.list=public.sites,public.buildings,public.assets,public.sensors,public.iot_telemetry,public.events

#plugin.name=pgoutput
publication.name=swarmpipe_publication
slot.name=swarmpipe_slot

snapshot.mode=initial
decimal.handling.mode=double

key.converter=org.apache.kafka.connect.json.JsonConverter
value.converter=org.apache.kafka.connect.json.JsonConverter
key.converter.schemas.enable=false
value.converter.schemas.enable=false
